<svg xmlns='http://www.w3.org/2000/svg' width='1160' height='440' viewBox='0 0 1160 440'><defs><marker id='a4a5060' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#4a5060'/></marker></defs>
<rect width='1160' height='440' rx='12' fill='#ffffff'/>
<text x='24' y='38' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='20' font-weight='600' fill='#1f2430'>What an event tag does</text>
<rect x='30' y='150' width='220' height='90' rx='10' fill='#f4f5f7' stroke='#7a8290' stroke-width='2'/>
<text x='140.0' y='182.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>Place the event tag</text>
<text x='140.0' y='200.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>plays nothing</text>
<text x='140.0' y='218.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>LED blinks turquoise once</text>
<rect x='310' y='70' width='190' height='70' rx='10' fill='#fff4e0' stroke='#d08a14' stroke-width='2'/>
<text x='405.0' y='110.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='400' fill='#1f2430'>Applies to: next figure</text>
<rect x='620' y='60' width='270' height='90' rx='10' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='2'/>
<text x='755.0' y='92.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>Place a figure</text>
<text x='755.0' y='110.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>it takes the actions</text>
<text x='755.0' y='128.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>and keeps them</text>
<rect x='310' y='250' width='190' height='70' rx='10' fill='#fff4e0' stroke='#d08a14' stroke-width='2'/>
<text x='405.0' y='290.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='400' fill='#1f2430'>Applies to: whole box</text>
<rect x='620' y='240' width='270' height='90' rx='10' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='2'/>
<text x='755.0' y='272.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>Box settings change</text>
<text x='755.0' y='290.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>locks, switch-off, times;</text>
<text x='755.0' y='308.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>optionally only until switch-off</text>
<rect x='930' y='140' width='210' height='110' rx='10' fill='#e6f6ee' stroke='#2f9a5f' stroke-width='2'/>
<text x='1035.0' y='173.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>Confirmation</text>
<text x='1035.0' y='191.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>5 blinks per action, tones:</text>
<text x='1035.0' y='209.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>turquoise + rising = on</text>
<text x='1035.0' y='227.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>lilac + falling = off</text>
<path d='M250,180 L280,180 L280,105 L310,105' fill='none' stroke='#4a5060' stroke-width='2' marker-end='url(#a4a5060)'/>
<path d='M250,210 L280,210 L280,285 L310,285' fill='none' stroke='#4a5060' stroke-width='2' marker-end='url(#a4a5060)'/>
<path d='M500,105 L620,105' fill='none' stroke='#4a5060' stroke-width='2' marker-end='url(#a4a5060)'/>
<text x='560.0' y='95' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#3a4050'>within 60 s</text>
<path d='M500,285 L620,285' fill='none' stroke='#4a5060' stroke-width='2' marker-end='url(#a4a5060)'/>
<text x='560.0' y='275' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#3a4050'>at once</text>
<path d='M890,105 L1035,105 L1035,140' fill='none' stroke='#4a5060' stroke-width='2' marker-end='url(#a4a5060)'/>
<path d='M890,285 L1035,285 L1035,250' fill='none' stroke='#4a5060' stroke-width='2' marker-end='url(#a4a5060)'/>
<text x='30' y='400' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#3a4050'>"Set with the ears": while the tag lies on the box, the ears set the volume limit or the LED; the value counts when the tag is taken off.</text>
</svg>
