<svg xmlns='http://www.w3.org/2000/svg' width='1090' height='480' viewBox='0 0 1090 480'><defs><marker id='a4a5060' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#4a5060'/></marker><marker id='ac94040' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c94040'/></marker></defs>
<rect width='1090' height='480' rx='12' fill='#ffffff'/>
<text x='24' y='38' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='20' font-weight='600' fill='#1f2430'>Firmware update through teddyCloud</text>
<rect x='30' y='80' width='240' height='90' rx='10' fill='#e6f6ee' stroke='#2f9a5f' stroke-width='2'/>
<text x='150.0' y='112.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>1  Image into the library</text>
<text x='150.0' y='130.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>upload or GitHub download</text>
<text x='150.0' y='148.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>channel release / beta / alpha</text>
<rect x='295' y='80' width='240' height='90' rx='10' fill='#e6f6ee' stroke='#2f9a5f' stroke-width='2'/>
<text x='415.0' y='112.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>2  Which box gets what</text>
<text x='415.0' y='130.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>manual: assigned image</text>
<text x='415.0' y='148.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>automatic: newest of its channel</text>
<rect x='560' y='80' width='240' height='90' rx='10' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='2'/>
<text x='680.0' y='112.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>3  The box asks</text>
<text x='680.0' y='130.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>at its start, or at once</text>
<text x='680.0' y='148.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>with "Now" (remote control)</text>
<rect x='825' y='80' width='240' height='90' rx='10' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='2'/>
<text x='945.0' y='121.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>4  Download</text>
<text x='945.0' y='139.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>into the free slot</text>
<rect x='825' y='220' width='240' height='80' rx='10' fill='#f1ecfb' stroke='#7b55c7' stroke-width='2'/>
<text x='945.0' y='256.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>5  Trial start</text>
<text x='945.0' y='274.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>of the new build</text>
<rect x='470' y='370' width='240' height='80' rx='10' fill='#e6f6ee' stroke='#2f9a5f' stroke-width='2'/>
<text x='590.0' y='406.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>Confirmed</text>
<text x='590.0' y='424.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>the build stays</text>
