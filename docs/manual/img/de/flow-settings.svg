<text x='30' y='335' text-anchor='start' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#3a4050'>Die Einstellung eines Tonies gewinnt in beide Richtungen gegen die der Box.</text>
