<svg xmlns='http://www.w3.org/2000/svg' width='980' height='360' viewBox='0 0 980 360'><defs><marker id='a4a5060' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#4a5060'/></marker></defs>
<rect width='980' height='360' rx='12' fill='#ffffff'/>
