<svg xmlns='http://www.w3.org/2000/svg' width='980' height='400' viewBox='0 0 980 400'><defs><marker id='a4a5060' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#4a5060'/></marker><marker id='ac94040' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#c94040'/></marker></defs>
<rect width='980' height='400' rx='12' fill='#ffffff'/>
<text x='24' y='38' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='20' font-weight='600' fill='#1f2430'>Globales Fortsetzen: ein Tonie, mehrere Boxen</text>
<rect x='30' y='90' width='220' height='90' rx='10' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='2'/>
<text x='140.0' y='122.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>Box A</text>
<text x='140.0' y='140.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>der Tonie spielt</text>
<text x='140.0' y='158.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>bis 12:40</text>
<rect x='380' y='90' width='220' height='90' rx='10' fill='#e6f6ee' stroke='#2f9a5f' stroke-width='2'/>
<text x='490.0' y='122.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>teddyCloud</text>
<text x='490.0' y='140.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>merkt sich die Position</text>
<text x='490.0' y='158.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>pro Tonie</text>
<rect x='730' y='90' width='220' height='90' rx='10' fill='#e8f0fe' stroke='#3b6fd8' stroke-width='2'/>
<text x='840.0' y='113.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>Box B</text>
<text x='840.0' y='131.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>der Tonie wird aufgelegt</text>
<text x='840.0' y='149.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>fragt nach der Position</text>
<text x='840.0' y='167.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>spielt ab 12:40 weiter</text>
<path d='M250,135 L380,135' fill='none' stroke='#4a5060' stroke-width='2' marker-end='url(#a4a5060)'/>
<text x='315.0' y='127' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#3a4050'>Position</text>
<path d='M730,120 L600,120' fill='none' stroke='#4a5060' stroke-width='2' marker-end='url(#a4a5060)'/>
<path d='M600,150 L730,150' fill='none' stroke='#4a5060' stroke-width='2' marker-end='url(#a4a5060)'/>
<text x='665.0' y='170' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#3a4050'>Position</text>
<rect x='330' y='250' width='320' height='110' rx='10' fill='#fde9e9' stroke='#c94040' stroke-width='2'/>
<text x='490.0' y='283.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2430'>beide Boxen spielten offline:</text>
<text x='490.0' y='301.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>zwei Positionen</text>
<text x='490.0' y='319.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>im Bearbeiten-Dialog des Tonies eine wählen</text>
<text x='490.0' y='337.0' text-anchor='middle' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='400' fill='#1f2430'>bis dahin behält jede Box ihre eigene</text>
<path d='M490,180 L490,250' fill='none' stroke='#c94040' stroke-width='2' stroke-dasharray='6 5' marker-end='url(#ac94040)'/>
